services:
  postgres:
    image: postgres:13
    environment:
      POSTGRES_DB: telemetria_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user"]
      interval: 10s
      retries: 5
      timeout: 5s

volumes:
  postgres_data:
