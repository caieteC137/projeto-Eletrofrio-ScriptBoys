# =============================================================================
#  Nginx - reverse proxy para a Evolution API na OCI
# =============================================================================
#  Coloca o Evolution Manager (painel) atrás de HTTPS com Let's Encrypt.
#  Adiciona rate-limit no endpoint /manager/* para evitar abuso.
#
#  Antes de subir:
#    1. Substitua SEU_DOMINIO abaixo pelo seu domínio real (DNS A -> IP da VM).
#    2. Rode certbot para emitir o certificado:
#         sudo certbot certonly --nginx -d SEU_DOMINIO
#    3. O certbot cria /etc/letsencrypt/live/SEU_DOMINIO/fullchain.pem
#       (e privkey.pem). O nginx.conf abaixo ja aponta para esses caminhos.
# =============================================================================

# Limite de uploads do Evolution (midia) - 50 MB
client_max_body_size 50M;

# Rate limit: 30 requisicoes/segundo por IP no /manager/*
limit_req_zone $binary_remote_addr zone=evolution_limit:10m rate=30r/s;

# Redireciona HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name SEU_DOMINIO;

    # Permite ACME challenge (Let's Encrypt) sem redirecionar
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name SEU_DOMINIO;

    # Certificados (gerados por certbot)
    ssl_certificate     /etc/letsencrypt/live/SEU_DOMINIO/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/SEU_DOMINIO/privkey.pem;

    # SSL hardening (Mozilla intermediate)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Headers de segurança
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Logs
    access_log /var/log/nginx/evolution_access.log;
    error_log  /var/log/nginx/evolution_error.log warn;

    # Proxy para o container evolution
    location / {
        proxy_pass http://evolution:8080;
        proxy_http_version 1.1;

        # WebSocket (a Evolution usa para o socket do WhatsApp)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts mais generosos para envio de midia
        proxy_connect_timeout 60s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }

    # Rate-limit no /manager/* (cria instancia, manda msg, etc.)
    location /manager/ {
        limit_req zone=evolution_limit burst=60 nodelay;

        proxy_pass http://evolution:8080;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }
}

