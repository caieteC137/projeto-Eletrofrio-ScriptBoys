  # =============================================================================
  #  Override de PRODUCAO para Oracle Cloud (VM.Standard.A1.FMC)
  # =============================================================================
  #  Uso:
  #     docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
  #
  #  O que muda em relacao ao `docker-compose.yml` base:
  #   - Postgres e Redis NAO expoem porta no host (apenas na rede interna)
  #   - Evolution NAO expoe 8080 no host (acesso pelo nginx via 443)
  #   - Dashboard NAO expoe 5000 no host (acesso pelo nginx OU via SSH tunnel)
  #   - Limites de CPU/memoria por servico (Always Free ARM = 4 OCPU, 24 GB)
  #   - Log rotation centralizado via driver json-file
  #   - Restart policy mais agressiva
  #   - Variavel EVOLUTION_URL apontando para o servico interno (evolution:8080)
  #     porque o bot e o main estao na mesma stack
  # =============================================================================

version: '3.8'

services:
  app:
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  main:
    restart: always
    environment:
      # Quando rodando dentro da stack, o host da Evolution eh o nome do servico
      - EVOLUTION_URL=http://evolution:8080
      - EVOLUTION_DB_HOST=postgres

  bot:
    restart: always
    environment:
      - EVOLUTION_URL=http://evolution:8080
      - EVOLUTION_DB_HOST=postgres

  postgres:
    # Em producao, Postgres NAO precisa expor porta no host.
    # Apenas os containers na mesma rede acessam.
    expose:
      - "5432"
    # `!reset` limpa qualquer `ports` que o base venha a definir.
    ports: !reset []
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  redis:
    expose:
      - "6379"
    ports: !reset []
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  evolution:
    # Em producao, Evolution expoe 8080 APENAS no localhost (127.0.0.1).
    # O cloudflared (ou nginx) se conecta localmente para fazer proxy reverso.
    # Porta 8080 NAO fica acessivel publicamente na VM.
    # `!reset` substitui a lista de ports do base (ao inves de fazer merge).
    ports: !reset
      - "127.0.0.1:8080:8080"
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1.50'
          memory: 2G
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  dashboard:
    # Em producao o dashboard expoe 5000 APENAS no localhost (127.0.0.1).
    # O cloudflared se conecta localmente para fazer proxy reverso.
    # Porta 5000 NAO fica acessivel publicamente na VM.
    # `!reset` substitui a lista de ports do base (ao inves de fazer merge).
    ports: !reset
      - "127.0.0.1:5000:5000"
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
